version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: notesapp-mysql
    restart: always
    environment:
      MYSQL_DATABASE: defaultdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notesapp-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: defaultdb
      PORT: 3000
